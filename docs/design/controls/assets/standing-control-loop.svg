<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1320" height="790" viewBox="0 0 1320 790" role="img" aria-labelledby="title desc">
  <title id="title">CAMEL standing control</title>
  <desc id="desc">The Pixhawk sends attitude directly to the STM32. The STM32 closes stance using joint feedback from four suspension drives. The Jetson sends expiring goals over SPI. A second CAN-FD bus serves four wheel drives. If the Jetson reboots, the STM32 commands zero travel and continues stance correction while sensors and drives are healthy and powered.</desc>
  <defs>
    <marker id="tip" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#487078" />
    </marker>
    <marker id="active" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#116b69" />
    </marker>
    <marker id="mech" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse" viewBox="0 0 9 9">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#68858a" />
    </marker>
  </defs>
  <rect width="1320" height="790" fill="white" />
  <text x="52" y="54" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#172d36" text-anchor="start">CAMEL standing control</text>
  <text x="54" y="89" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#49626b" text-anchor="start">Proposed architecture. Communication and body-loop rates are bench targets.</text>
  <rect x="117" y="118" width="354" height="87" rx="9" fill="#f6f9f8" stroke="#9baeb0" stroke-width="1.75" />
  <rect x="493" y="118" width="395" height="87" rx="9" fill="#f6f9f8" stroke="#9baeb0" stroke-width="1.75" />
  <rect x="909" y="118" width="349" height="87" rx="9" fill="#f6f9f8" stroke="#9baeb0" stroke-width="1.75" />
  <a href="https://docs.holybro.com/autopilot/pixhawk-6c/pixhawk-6c-ports" xlink:href="https://docs.holybro.com/autopilot/pixhawk-6c/pixhawk-6c-ports">
    <text x="138" y="154" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#116b69" text-anchor="start">Pixhawk 6C</text>
  </a>
  <text x="138" y="184" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">Body attitude, rates and health</text>
  <a href="https://developer.nvidia.com/embedded/learn/jetson-orin-nano-devkit-user-guide/hardware_spec.html" xlink:href="https://developer.nvidia.com/embedded/learn/jetson-orin-nano-devkit-user-guide/hardware_spec.html">
    <text x="513" y="154" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#116b69" text-anchor="start">Jetson Orin Nano Super</text>
  </a>
  <text x="513" y="184" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">Planning and motion goals</text>
  <a href="https://radiomasterrc.com/products/er6-2-4ghz-elrs-pwm-receiver" xlink:href="https://radiomasterrc.com/products/er6-2-4ghz-elrs-pwm-receiver">
    <text x="929" y="154" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#116b69" text-anchor="start">RadioMaster ER6</text>
  </a>
  <text x="929" y="184" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">Manual control and enable</text>
  <path d="M151 206 V291" fill="none" stroke="#116b69" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#active)" />
  <path d="M526 206 V291" fill="none" stroke="#487078" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#tip)" marker-start="url(#tip)" />
  <path d="M942 206 V291" fill="none" stroke="#487078" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#tip)" />
  <text x="169" y="242" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#116b69" text-anchor="start">TELEM UART / MAVLink</text>
  <text x="169" y="270" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">250 Hz attitude requested</text>
  <text x="545" y="242" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172d36" text-anchor="start">SPI at 250 frames/s</text>
  <text x="545" y="270" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">20–50 Hz goals / status back</text>
  <text x="960" y="242" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172d36" text-anchor="start">PWM at 50 Hz</text>
  <text x="960" y="270" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">Manual input to STM32</text>
  <rect x="117" y="294" width="1141" height="118" rx="9" fill="#e4f2ef" stroke="#116b69" stroke-width="2.6" />
  <a href="https://github.com/dmBots/DM-MC02/tree/master/manual" xlink:href="https://github.com/dmBots/DM-MC02/tree/master/manual">
    <text x="140" y="332" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#116b69" text-anchor="start">DaMiao DM-MC02</text>
  </a>
  <text x="420" y="332" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#172d36" text-anchor="start">STM32H723</text>
  <text x="140" y="367" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#172d36" text-anchor="start">250 Hz standing loop</text>
  <text x="410" y="367" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#172d36" text-anchor="start">Combines body tilt and joint feedback to correct suspension.</text>
  <text x="140" y="395" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#172d36" text-anchor="start">On Jetson timeout, expire its motion goal and command zero travel. Keep correcting stance while feedback is healthy.</text>
  <path d="M185 413 V495" fill="none" stroke="#116b69" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#active)" marker-start="url(#active)" />
  <path d="M778 413 V495" fill="none" stroke="#487078" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#tip)" marker-start="url(#tip)" />
  <text x="204" y="449" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#116b69" text-anchor="start">CAN-FD 1</text>
  <text x="204" y="476" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">500 Hz per drive, command and feedback</text>
  <text x="797" y="449" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#172d36" text-anchor="start">CAN-FD 2</text>
  <text x="797" y="476" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">500 Hz per drive, command and feedback</text>
  <rect x="117" y="498" width="551" height="83" rx="9" fill="#f6f9f8" stroke="#9baeb0" stroke-width="1.75" />
  <rect x="687" y="498" width="571" height="83" rx="9" fill="#f6f9f8" stroke="#9baeb0" stroke-width="1.75" />
  <a href="https://mjbots.com/products/moteus-x1" xlink:href="https://mjbots.com/products/moteus-x1">
    <text x="140" y="535" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#116b69" text-anchor="start">4 × moteus X1</text>
  </a>
  <text x="140" y="564" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#172d36" text-anchor="start">Suspension drives and joint encoders</text>
  <a href="https://mjbots.com/products/moteus-x1" xlink:href="https://mjbots.com/products/moteus-x1">
    <text x="710" y="535" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#116b69" text-anchor="start">4 × moteus X1</text>
  </a>
  <text x="710" y="564" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#172d36" text-anchor="start">Wheel drives and encoders</text>
  <path d="M185 582 V646" fill="none" stroke="#68858a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#mech)" />
  <path d="M778 582 V646" fill="none" stroke="#68858a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#mech)" />
  <text x="204" y="620" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">Suspension actuation</text>
  <text x="797" y="620" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">Wheel actuation</text>
  <rect x="117" y="649" width="1141" height="63" rx="9" fill="#f2f5f4" stroke="#9baeb0" stroke-width="1.75" />
  <text x="139" y="689" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172d36" text-anchor="start">Robot body motion</text>
  <text x="397" y="689" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#172d36" text-anchor="start">Each X1 runs its own 15–30 kHz servo loop.</text>
  <path d="M116 680 H66 V162 H115" fill="none" stroke="#68858a" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#mech)" stroke-dasharray="8 6" />
  <text x="54" y="443" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#49626b" text-anchor="middle" transform="rotate(-90 54 443)">Body motion sensed by IMUs</text>
  <text x="118" y="758" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#172d36" text-anchor="start">Power requirement</text>
  <text x="330" y="758" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172d36" text-anchor="start">Pixhawk, STM32 and drives stay powered through a Jetson reboot.</text>
</svg>
