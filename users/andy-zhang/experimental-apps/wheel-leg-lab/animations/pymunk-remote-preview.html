<script>
(() => {

  let state={case:'square',time:.25,force:'all'},plots=[],playing=false,raf=0,last=0;
  const fmt=(x,n=2)=>Number(x).toFixed(n),visible={};
  function saved(value){const s=value?.privateContent||value?.modelContent;if(!s)return;if(['square','impulse'].includes(s.case))state.case=s.case;if(Number.isFinite(s.time))state.time=Math.max(0,Math.min(3,s.time));if(['all','1','2','3'].includes(s.force))state.force=s.force;}
  saved(window.openai?.widgetState);
  function save(){window.openai?.setWidgetState?.({modelContent:{...state,engine:'Pymunk 7.3.0',wheel_radius_mm:200,extension_mm:50,mode:'recorded playback'},privateContent:state})?.catch(()=>{});}
  const active=()=>data.cases[state.case];
  const nearest=(rows,t)=>rows[D.bisector(r=>r[0]).center(rows,t)];
  function interpolate(rows,t,index){let j=D.bisector(r=>r[0]).left(rows,t);if(j<=0)return rows[0][index];if(j>=rows.length)return rows.at(-1)[index];const a=rows[j-1],b=rows[j],f=(t-a[0])/(b[0]-a[0]);return a[index]+f*(b[index]-a[index]);}
  function drawLeg(){
    const a=active(),frame=nearest(a.frames,state.time),W=el('leg').clientWidth,H=W<450?375:395,modelHeight=H-90;
    const svg=D.select(el('leg')).attr('viewBox',`0 0 ${W} ${H}`).attr('height',H);svg.selectAll('*').remove();
    svg.append('title').text('Actual Pymunk playback; hip fixed, 200 mm wheel radius, 50 mm lower-link extension.');
    const points=a.frames.flatMap(f=>[[f[1],f[2]],[f[3],f[4]],[f[5]-.2,f[6]-.2],[f[5]+.2,f[6]+.2],[f[7],f[8]]]);
    const xe=D.extent(points,p=>p[0]),ye=D.extent(points,p=>p[1]),scale=Math.min((W-90)/(xe[1]-xe[0]),(modelHeight-45)/(ye[1]-ye[0]));

    const A=[x(frame[1]),y(frame[2])],B=[x(frame[3]),y(frame[4])],C=[x(frame[5]),y(frame[6])],E=[x(frame[7]),y(frame[8])];

    if(frame[11]){
      const factor=a.model.debug_scale,position=p=>[x(p[0]/factor),y(p[1]/factor)],nativeColor=c=>`rgba(${c[0]},${c[1]},${c[2]},${c[3]/255})`;
      for(const p of frame[11]){
        if(p.kind==='circle'){const q=position(p.pos),r=p.radius/factor*scale;svg.append('circle').attr('class','pm-engine-shape').attr('cx',q[0]).attr('cy',q[1]).attr('r',r).attr('fill',nativeColor(p.fill)).attr('stroke',nativeColor(p.outline));svg.append('line').attr('x1',q[0]).attr('y1',q[1]).attr('x2',q[0]+r*Math.cos(p.angle)).attr('y2',q[1]-r*Math.sin(p.angle)).attr('stroke',nativeColor(p.outline));}

        else if(p.kind==='segment'){const a=position(p.a),b=position(p.b);svg.append('line').attr('x1',a[0]).attr('y1',a[1]).attr('x2',b[0]).attr('y2',b[1]).attr('stroke',nativeColor(p.color)).attr('stroke-width',1.5);}
        else if(p.kind==='dot'){const q=position(p.pos);svg.append('circle').attr('cx',q[0]).attr('cy',q[1]).attr('r',p.size/2).attr('fill',nativeColor(p.color));}
      }
    }else{
    svg.append('path').attr('d',line([A,B])).attr('fill','none').attr('stroke',colors[0]).attr('stroke-width',7).attr('stroke-linecap','round');

    for(const [p,r] of [[A,.028],[B,.014]])svg.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',r*scale).attr('fill','var(--background)').attr('stroke','var(--foreground)').attr('stroke-width',1.5);
    svg.append('circle').attr('cx',C[0]).attr('cy',C[1]).attr('r',.2*scale).attr('fill','none').attr('stroke','var(--foreground)').attr('stroke-width',2);
    svg.append('path').attr('d',`M${C[0]-.2*scale},${C[1]}h${.4*scale}M${C[0]},${C[1]-.2*scale}v${.4*scale}`).attr('stroke','var(--border)');

    }
    svg.append('path').attr('d',`M${A[0]-22},${A[1]-8}h44`).attr('stroke','var(--foreground)').attr('stroke-width',3);

  function drawInput(svg,W,H,hub,rows){

    const lane=svg.append('g').attr('class','pm-disturbance-lane').attr('data-input',value);
    lane.append('text').attr('x',16).attr('y',H-80).text('Moving force input (N)');
    lane.append('text').attr('x',W-16).attr('y',H-80).attr('text-anchor','end').text(`Δ ${value>=0?'+':''}${fmt(value,2)} N`);
    lane.append('defs').append('clipPath').attr('id','pm-input-clip').append('rect').attr('x',16).attr('y',H-73).attr('width',W-32).attr('height',57);
    const marks=lane.append('g').attr('clip-path','url(#pm-input-clip)');
    marks.append('line').attr('x1',16).attr('x2',W-16).attr('y1',base).attr('y2',base).attr('stroke','var(--border)');
    marks.append('path').datum(rows).attr('class','pm-disturbance-profile').attr('d',D.line().x(r=>x(r[0])).y(r=>y(r[ki.input]))).attr('fill','none').attr('stroke',colors[0]).attr('stroke-width',2.5);
    marks.append('line').attr('x1',hub[0]).attr('x2',hub[0]).attr('y1',H-73).attr('y2',H-16).attr('stroke',colors[1]).attr('stroke-width',1);
    marks.append('circle').attr('class','pm-disturbance-marker').attr('cx',hub[0]).attr('cy',y(value)).attr('r',4).attr('fill',colors[1]);
    if(W>=420)lane.append('text').attr('x',16).attr('y',H-2).text('Applied force travels right → left; static bias is separate.');
    else lane.append('text').attr('x',16).attr('y',H-2).text('← Applied force profile · bias separate');
    if(Math.abs(value)<1e-8)return;
    const length=14+32*Math.abs(value)/peak,tip=hub[1]-Math.sign(value)*length,sign=Math.sign(value);
    const arrow=svg.append('g').attr('class','pm-disturbance-arrow').attr('data-value',value).attr('stroke',colors[1]).attr('stroke-width',2.5).attr('fill','none');
    arrow.append('path').attr('d',`M${hub[0]},${hub[1]}V${tip}M${hub[0]-5},${tip+sign*7}L${hub[0]},${tip}L${hub[0]+5},${tip+sign*7}`);
    svg.append('circle').attr('cx',hub[0]).attr('cy',hub[1]).attr('r',5).attr('fill',colors[1]);
  }
  function drawCharts(){
    plots=[];el('tip').hidden=true;const rows=active().rows;
    const forceSeries=[1,2,3].filter(j=>state.force==='all'||state.force===String(j)).map(j=>['j'+j+'_force','J'+j,colors[j-1]]);
    const definitions=[['forces-chart','Force (N)',forceSeries],['torque-chart','Torque (N·m)',[['spring_knee_moment','Spring about knee',colors[1]],['guide_hip_reaction','Guide at hip',colors[2]]]],['velocity-chart','Velocity (m/s)',[['hub_vy','Wheel vertical',colors[0]]]],['acceleration-chart','Acceleration (m/s²)',[['hub_ay','Wheel vertical',colors[0]]]]];
    for(const [id,label,series] of definitions){
      const container=el(id),W=container.clientWidth,H=230,left=68,right=16,top=14,bottom=44;
      container.innerHTML='';const legend=D.select(container).append('div').attr('class','pm-legend');
      series.forEach(([key,name,color])=>{if(visible[key]===undefined)visible[key]=true;const button=legend.append('button').attr('type','button').attr('class','cursor-interaction').attr('aria-pressed',visible[key]).html(`<span class="pm-swatch" style="--series:${color}"></span>${name}`);button.on('click',()=>{visible[key]=!visible[key];drawCharts();update(false);});});
      const show=series.filter(([key])=>visible[key]),all=(show.length?show:series).flatMap(([key])=>rows.map(r=>r[ki[key]])),extent=D.extent(all),pad=Math.max((extent[1]-extent[0])*.06,Math.max(Math.abs(extent[0]),Math.abs(extent[1]))*.03,.001);
      const x=D.scaleLinear().domain(D.extent(rows,r=>r[0])).range([left+4,W-right-4]),y=D.scaleLinear().domain([extent[0]-pad,extent[1]+pad]).nice().range([H-bottom-4,top+4]);
      const svg=D.select(container).append('svg').attr('class','pm-svg').attr('viewBox',`0 0 ${W} ${H}`).attr('height',H).attr('role','img').attr('aria-label',label+' versus recorded time');svg.append('title').text(label+'; recorded Pymunk results');
      svg.append('rect').attr('data-chart-frame','').attr('x',left).attr('y',top).attr('width',W-left-right).attr('height',H-top-bottom).attr('fill','none').attr('stroke','var(--border)');
      svg.append('g').attr('transform',`translate(0,${H-bottom})`).call(D.axisBottom(x).ticks(W<400?4:5));
      svg.append('g').attr('transform',`translate(${left},0)`).call(D.axisLeft(y).ticks(4).tickFormat(D.format('.3~g')));
      svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(left+W-right)/2).attr('y',H-8).attr('text-anchor','middle').text('Time (s)');
      svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('transform',`translate(15,${(top+H-bottom)/2}) rotate(-90)`).attr('text-anchor','middle').text(label);
      const clip='pm-clip-'+id;svg.append('defs').append('clipPath').attr('id',clip).append('rect').attr('x',left).attr('y',top).attr('width',W-left-right).attr('height',H-top-bottom);
      const marks=svg.append('g').attr('clip-path',`url(#${clip})`);
      show.forEach(([key,name,color])=>marks.append('path').datum(rows).attr('fill','none').attr('stroke',color).attr('stroke-width',2).attr('d',D.line().x(r=>x(r[0])).y(r=>y(r[ki[key]]))));
      const cursor=marks.append('line').attr('y1',top).attr('y2',H-bottom).attr('stroke','var(--foreground)').attr('opacity',.3),dots=marks.append('g');
      const hover=marks.append('g'),guide=hover.append('line').attr('data-chart-hover-guide','').attr('y1',top).attr('y2',H-bottom).attr('stroke','var(--foreground)').attr('opacity',0);let pinned=false;
      function showTip(event){const [px]=D.pointer(event,svg.node()),t=x.invert(Math.max(left+4,Math.min(W-right-4,px)));guide.attr('x1',x(t)).attr('x2',x(t)).attr('opacity',.5);hover.selectAll('circle').remove();
        const lines=[fmt(t,3)+' s'];show.forEach(([key,name,color])=>{const value=interpolate(rows,t,ki[key]);hover.append('circle').attr('data-chart-hover-marker','').attr('cx',x(t)).attr('cy',y(value)).attr('r',4).attr('fill',color);lines.push(name+': '+fmt(value,3)+(id==='forces-chart'?' N / '+fmt(value/9.80665,3)+' kgf':''));});
        const box=root.getBoundingClientRect(),cb=container.getBoundingClientRect();el('tip').textContent=lines.join('\n');el('tip').hidden=false;el('tip').style.left=Math.max(0,Math.min(root.clientWidth-240,cb.left-box.left+px+8))+'px';el('tip').style.top=cb.top-box.top+35+'px';
      }
      svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('x',left).attr('y',top).attr('width',W-left-right).attr('height',H-top-bottom).attr('fill','transparent').on('pointermove',e=>{if(!pinned)showTip(e);}).on('pointerleave',()=>{if(!pinned){guide.attr('opacity',0);hover.selectAll('circle').remove();el('tip').hidden=true;}}).on('click',e=>{pinned=!pinned;if(pinned)showTip(e);else{guide.attr('opacity',0);hover.selectAll('circle').remove();el('tip').hidden=true;}});
      for(const axis of svg.selectAll('g').nodes()){let last=null;for(const text of axis.querySelectorAll(':scope > .tick > text')){const b=text.getBoundingClientRect();if(last&&b.left<last.right+4&&b.top<last.bottom&&b.bottom>last.top)text.style.visibility='hidden';else last=b;}}
      plots.push({x,y,show,cursor,dots});
    }
  }
  function update(announce=true){
    const a=active(),r=nearest(a.rows,state.time);el('time').value=state.time;el('time-label').textContent=fmt(state.time,3)+' s';
    el('state').setAttribute('aria-live',announce?'polite':'off');el('state').textContent=`θ ${fmt(r[ki.theta_deg],1)}° · knee force ${fmt(r[ki.j2_force],1)} N / ${fmt(r[ki.j2_force]/9.80665,2)} kgf · spring moment ${fmt(r[ki.spring_knee_moment],1)} N·m`;
    for(const plot of plots){plot.cursor.attr('x1',plot.x(state.time)).attr('x2',plot.x(state.time));plot.dots.selectAll('*').remove();plot.show.forEach(([key,name,color])=>plot.dots.append('circle').attr('cx',plot.x(state.time)).attr('cy',plot.y(interpolate(a.rows,state.time,ki[key]))).attr('r',4).attr('fill',color));}
    drawLeg();
  }
  function render(){el('case').value=state.case;el('force').value=state.force;drawCharts();el('input-detail').textContent=active().label;el('objects').textContent=JSON.stringify(active().model,null,2);update();}
  function pause(){playing=false;cancelAnimationFrame(raf);last=0;el('play').textContent='Play';}
  el('case').onchange=()=>{pause();state.case=el('case').value;state.time=.25;render();save();};
  el('force').onchange=()=>{state.force=el('force').value;drawCharts();update();save();};
  el('time').oninput=()=>{pause();state.time=Number(el('time').value);update();};el('time').onchange=save;
  el('play').onclick=()=>{if(playing){pause();save();return;}if(state.time>=3)state.time=0;playing=true;el('play').textContent='Pause';last=0;
    function frame(now){if(last)state.time=Math.min(3,state.time+(now-last)/1000);last=now;update(false);if(state.time>=3){pause();save();return;}raf=requestAnimationFrame(frame);}raf=requestAnimationFrame(frame);
  };
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){pause();saved(e.detail.globals.widgetState);render();}});
  let resizeFrame=0;new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{drawCharts();update(false);});}).observe(root);
  render();
})();
</script>
