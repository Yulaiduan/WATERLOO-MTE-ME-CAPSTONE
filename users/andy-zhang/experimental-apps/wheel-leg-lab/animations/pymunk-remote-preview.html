    const points=a.frames.flatMap(f=>[[f[1],f[2]],[f[3],f[4]],[f[5]-.2,f[6]-.2],[f[5]+.2,f[6]+.2],[f[7],f[8]]]);
    const xe=D.extent(points,p=>p[0]),ye=D.extent(points,p=>p[1]),scale=Math.min((W-90)/(xe[1]-xe[0]),(modelHeight-45)/(ye[1]-ye[0]));
    const x=v=>W/2+(v-(xe[0]+xe[1])/2)*scale,y=v=>modelHeight/2-(v-(ye[0]+ye[1])/2)*scale;
    const A=[x(frame[1]),y(frame[2])],B=[x(frame[3]),y(frame[4])],C=[x(frame[5]),y(frame[6])],E=[x(frame[7]),y(frame[8])];
    const line=points=>D.line()(points);
    if(frame[11]){
      const factor=a.model.debug_scale,position=p=>[x(p[0]/factor),y(p[1]/factor)],nativeColor=c=>c[2]>150&&c[0]<100?colors[0]:c[1]>150&&c[0]<100?colors[2]:c[0]>200&&c[1]>150?'var(--viz-series-4)':c[0]>150&&c[2]>150?'var(--viz-series-5)':'var(--foreground)';
      for(const p of frame[11]){
        if(p.kind==='circle'){const q=position(p.pos),r=p.radius/factor*scale;svg.append('circle').attr('class','pm-engine-shape').attr('cx',q[0]).attr('cy',q[1]).attr('r',r).attr('fill',nativeColor(p.fill)).attr('stroke',nativeColor(p.outline));svg.append('line').attr('x1',q[0]).attr('y1',q[1]).attr('x2',q[0]+r*Math.cos(p.angle)).attr('y2',q[1]-r*Math.sin(p.angle)).attr('stroke',nativeColor(p.outline));}
        else if(p.kind==='capsule'){const a=position(p.a),b=position(p.b);svg.append('line').attr('class','pm-engine-shape').attr('x1',a[0]).attr('y1',a[1]).attr('x2',b[0]).attr('y2',b[1]).attr('stroke',nativeColor(p.outline)).attr('stroke-width',2*p.radius/factor*scale+2).attr('stroke-linecap','round');svg.append('line').attr('x1',a[0]).attr('y1',a[1]).attr('x2',b[0]).attr('y2',b[1]).attr('stroke',nativeColor(p.fill)).attr('stroke-width',2*p.radius/factor*scale).attr('stroke-linecap','round');}
        else if(p.kind==='segment'){const a=position(p.a),b=position(p.b);svg.append('line').attr('x1',a[0]).attr('y1',a[1]).attr('x2',b[0]).attr('y2',b[1]).attr('stroke',nativeColor(p.color)).attr('stroke-width',1.5);}
        else if(p.kind==='dot'){const q=position(p.pos);svg.append('circle').attr('cx',q[0]).attr('cy',q[1]).attr('r',p.size/2).attr('fill',nativeColor(p.color));}
      }
    }else{
    svg.append('path').attr('d',line([A,B])).attr('fill','none').attr('stroke',colors[0]).attr('stroke-width',7).attr('stroke-linecap','round');
    svg.append('path').attr('d',line([E,C])).attr('fill','none').attr('stroke',colors[2]).attr('stroke-width',7).attr('stroke-linecap','round');
    for(const [p,r] of [[A,.028],[B,.014]])svg.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',r*scale).attr('fill','var(--background)').attr('stroke','var(--foreground)').attr('stroke-width',1.5);
    svg.append('circle').attr('cx',C[0]).attr('cy',C[1]).attr('r',.2*scale).attr('fill','none').attr('stroke','var(--foreground)').attr('stroke-width',2);
    svg.append('path').attr('d',`M${C[0]-.2*scale},${C[1]}h${.4*scale}M${C[0]},${C[1]-.2*scale}v${.4*scale}`).attr('stroke','var(--border)');
    const dx=E[0]-A[0],dy=E[1]-A[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;
    const coil=Array.from({length:23},(_,i)=>{const f=i/22,z=i<3||i>19?0:(i%2?5:-5);return[A[0]+dx*f+nx*z,A[1]+dy*f+ny*z];});
    svg.append('path').attr('d',line(coil)).attr('fill','none').attr('stroke',colors[1]).attr('stroke-width',2.5);
    }
    svg.append('path').attr('d',`M${A[0]-22},${A[1]-8}h44`).attr('stroke','var(--foreground)').attr('stroke-width',3);
    for(const [p,name,ox,oy] of [[A,'Hip · J1',-20,-16],[B,'Knee · J2',12,16],[C,'Wheel · J3',10,18],[E,'50 mm tip',12,-10]]){
      svg.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',3.5).attr('fill','var(--background)').attr('stroke','var(--foreground)').attr('stroke-width',1.5);
      svg.append('text').attr('x',Math.max(4,Math.min(W-85,p[0]+ox))).attr('y',Math.max(13,Math.min(H-8,p[1]+oy))).text(name);
    }
    drawInput(svg,W,H,C,a.rows,y(a.position_origin[1]),scale);
  }
  function drawInput(svg,W,H,hub,rows,originY,scale){
    const value=interpolate(rows,state.time,ki.input_mm),peak=Math.max(...rows.map(r=>Math.abs(r[ki.input_mm])),.000001),base=H-38,pps=(W-32)/3;
    const x=t=>hub[0]+(t-state.time)*pps,y=v=>base-v/peak*18;
    const lane=svg.append('g').attr('class','pm-disturbance-lane').attr('data-input',value);
    lane.append('text').attr('x',16).attr('y',H-80).text('Moving wheel height (mm)');
    lane.append('text').attr('x',W-16).attr('y',H-80).attr('text-anchor','end').text(`Δ ${value>=0?'+':''}${fmt(value,1)} mm`);
    lane.append('defs').append('clipPath').attr('id','pm-input-clip').append('rect').attr('x',16).attr('y',H-73).attr('width',W-32).attr('height',57);
    const marks=lane.append('g').attr('clip-path','url(#pm-input-clip)');
    marks.append('line').attr('x1',16).attr('x2',W-16).attr('y1',base).attr('y2',base).attr('stroke','var(--border)');
    marks.append('path').datum(rows).attr('class','pm-disturbance-profile').attr('d',D.line().x(r=>x(r[0])).y(r=>y(r[ki.input_mm]))).attr('fill','none').attr('stroke',colors[0]).attr('stroke-width',2.5);
    marks.append('line').attr('x1',hub[0]).attr('x2',hub[0]).attr('y1',H-73).attr('y2',H-16).attr('stroke',colors[1]).attr('stroke-width',1);
    marks.append('circle').attr('class','pm-disturbance-marker').attr('cx',hub[0]).attr('cy',y(value)).attr('r',4).attr('fill',colors[1]);
    if(W>=420)lane.append('text').attr('x',16).attr('y',H-2).text('← Prescribed height · reaction force is measured.');
    else lane.append('text').attr('x',16).attr('y',H-2).text('← Height input · force measured');
    if(Math.abs(value)<1e-8)return;
    const tip=originY-value/1000*scale,sign=Math.sign(value);hub=[hub[0]-15,originY];
    const arrow=svg.append('g').attr('class','pm-disturbance-arrow').attr('data-value',value).attr('data-kind','position').attr('stroke',colors[1]).attr('stroke-width',2.5).attr('fill','none');
    arrow.append('path').attr('d',`M${hub[0]},${hub[1]}V${tip}M${hub[0]-5},${tip+sign*7}L${hub[0]},${tip}L${hub[0]+5},${tip+sign*7}M${hub[0]-5},${hub[1]-sign*7}L${hub[0]},${hub[1]}L${hub[0]+5},${hub[1]-sign*7}`);
    svg.append('circle').attr('cx',hub[0]).attr('cy',hub[1]).attr('r',5).attr('fill',colors[1]);
  }

  function resolved(token){const probe=document.createElement('span');probe.style.color=token;probe.hidden=true;root.append(probe);const color=getComputedStyle(probe).color;probe.remove();return color;}
  function chartStyle(){return {paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{family:'Inter, Segoe UI, sans-serif',size:12,color:resolved('var(--foreground)')}};}
  const plotConfig={responsive:true,scrollZoom:true,displayModeBar:true,displaylogo:false,toImageButtonOptions:{format:'png',scale:2},modeBarButtonsToRemove:['lasso2d','select2d']};
  function applyTheme(theme){if(!['light','dark'].includes(theme))return;document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;renderPlotsForTheme();}
  window.addEventListener('message',e=>{if(e.data?.type==='motion-lab-theme')applyTheme(e.data.theme);});
  window.addEventListener('storage',e=>{if(e.key==='motion-lab-theme')applyTheme(e.newValue);});
  try{const theme=localStorage.getItem('motion-lab-theme');if(['light','dark'].includes(theme)){document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;}}catch{}

  function renderPlotsForTheme(){drawCharts();update(false);}
  let lastPlotUpdate=0;
  function drawCharts(){
    plots=[];el('tip').hidden=true;const rows=active().rows;
    const forceSeries=[1,2,3].filter(j=>state.force==='all'||state.force===String(j)).map(j=>['j'+j+'_force','J'+j,colors[j-1]]);
    forceSeries.push(['driver_force','Fixture vertical','var(--viz-series-4)']);
    const definitions=[['height-chart','Displacement (mm)',[['input_mm','Wheel command',colors[0]],['position_actual_mm','Wheel achieved',colors[2]],['chassis_displacement_mm','Chassis response',colors[1]]]],['forces-chart','Force (N)',forceSeries],['torque-chart','Torque (N·m)',[['spring_knee_moment','Spring about knee',colors[1]],['guide_hip_reaction','Guide at hip',colors[2]]]],['velocity-chart','Velocity (m/s)',[['chassis_vy','Chassis response',colors[0]]]],['acceleration-chart','Acceleration (m/s²)',[['chassis_ay','Chassis response',colors[0]]]]];
    for(const [id,label,series] of definitions){
      const container=el(id),traces=[];
      container.parentElement.querySelector('.pm-legend')?.remove();
      const legend=document.createElement('div');legend.className='pm-legend';legend.setAttribute('aria-label',label+' series');container.before(legend);
      container.setAttribute('role','img');container.setAttribute('aria-label',label+' versus recorded time, interactive zoom plot');
      for(const [key,name,color] of series){
        const isForce=id==='forces-chart',index=traces.length;
        if(visible[key]===undefined)visible[key]=true;
        const button=document.createElement('button');button.type='button';button.className='cursor-interaction';button.setAttribute('aria-pressed',visible[key]);button.innerHTML=`<span class="pm-swatch" style="--series:${color}"></span>${name}`;
        button.onclick=()=>{visible[key]=!visible[key];button.setAttribute('aria-pressed',visible[key]);Plotly.restyle(container,{visible:visible[key]?true:'legendonly'},[index]);};legend.append(button);
        traces.push({x:rows.map(r=>r[0]),y:rows.map(r=>r[ki[key]]),customdata:isForce?rows.map(r=>r[ki[key]]/9.80665):undefined,type:'scatter',mode:'lines',name,visible:visible[key]?true:'legendonly',line:{color:resolved(color),width:2},hovertemplate:'%{y:.3f}'+(isForce?' N / %{customdata:.3f} kgf':'')+'<extra>'+name+'</extra>'});
      }
      const axis={gridcolor:resolved('var(--border)'),zerolinecolor:resolved('var(--border)'),automargin:true};
      Plotly.react(container,traces,{...chartStyle(),height:285,margin:{l:68,r:16,t:32,b:62},showlegend:false,hovermode:'x unified',dragmode:'zoom',uirevision:state.case+'-'+id,xaxis:{...axis,title:{text:'Time (s)'},range:[0,3],nticks:container.clientWidth<400?4:6},yaxis:{...axis,title:{text:label}},shapes:[{type:'line',xref:'x',yref:'paper',x0:state.time,x1:state.time,y0:0,y1:1,line:{color:resolved('var(--foreground)'),width:1,dash:'dot'}}]},plotConfig);
      plots.push({container});
    }
  }
  function update(announce=true){
    const a=active(),r=nearest(a.rows,state.time);el('time').value=state.time;el('time-label').textContent=fmt(state.time,3)+' s';
    el('state').setAttribute('aria-live',announce?'polite':'off');el('state').textContent=`Height ${fmt(r[ki.input_mm],1)} mm · θ ${fmt(r[ki.theta_deg],1)}° · knee force ${fmt(r[ki.j2_force],1)} N / ${fmt(r[ki.j2_force]/9.80665,2)} kgf · spring moment ${fmt(r[ki.spring_knee_moment],1)} N·m`;
    const now=performance.now();
    if(announce||now-lastPlotUpdate>80){lastPlotUpdate=now;for(const plot of plots)Plotly.relayout(plot.container,{'shapes[0].x0':state.time,'shapes[0].x1':state.time});}
    drawLeg();
  }
  function render(){el('case').value=state.case;el('force').value=state.force;drawCharts();el('input-detail').textContent=active().label;el('objects').textContent=JSON.stringify(active().model,null,2);update();}
  function pause(){playing=false;cancelAnimationFrame(raf);last=0;el('play').textContent='Play';}
  el('case').onchange=()=>{pause();state.case=el('case').value;state.time=.25;render();save();};
  el('force').onchange=()=>{state.force=el('force').value;drawCharts();update();save();};
  el('time').oninput=()=>{pause();state.time=Number(el('time').value);update();};el('time').onchange=save;
  el('play').onclick=()=>{if(playing){pause();save();return;}if(state.time>=3)state.time=0;playing=true;el('play').textContent='Pause';last=0;
    function frame(now){if(last)state.time=Math.min(3,state.time+(now-last)/1000);last=now;update(false);if(state.time>=3){pause();save();return;}raf=requestAnimationFrame(frame);}raf=requestAnimationFrame(frame);
  };
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){pause();saved(e.detail.globals.widgetState);render();}});
  let resizeFrame=0;new ResizeObserver(()=>{cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{plots.forEach(p=>Plotly.Plots.resize(p.container));update(false);});}).observe(root);
  render();
})();
</script>
