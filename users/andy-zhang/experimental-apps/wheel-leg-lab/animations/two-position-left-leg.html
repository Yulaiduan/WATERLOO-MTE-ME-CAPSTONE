<div id="two-position-left-leg">
  <style>
    #two-position-left-leg .motion-view{width:100%;height:520px;display:block;}
    #two-position-left-leg .motion-view text{fill:var(--foreground);}
    #two-position-left-leg .timeline{margin-top:12px;}
    #two-position-left-leg .legend{display:flex;flex-wrap:wrap;gap:8px 16px;}
    #two-position-left-leg .legend span{display:inline-flex;align-items:center;gap:6px;}
    #two-position-left-leg .swatch{width:18px;height:3px;display:inline-block;}
  </style>
  <div class="viz-controls"><button class="btn" type="button" data-play>Pause</button><output data-phase aria-live="polite">Below-left · pulley locked</output></div>
  <div class="timeline"><label class="form-label" for="left-switch-progress">Inversion sequence: <output data-progress class="tabular-nums">0%</output></label><input id="left-switch-progress" class="form-range" type="range" min="0" max="100" step="0.1" value="0"></div>
  <svg class="motion-view" role="img" aria-labelledby="left-switch-title left-switch-description">
    <title id="left-switch-title">Two indexed hip-pulley positions keep both wheel paths to the left</title>
    <desc id="left-switch-description">Below the chassis, the normally grounded hip pulley locks at minus twelve degrees and the wheel center moves below-left. The leg fully folds until C coincides with A. The hip pulley then rotates twenty-four degrees while the upper link moves by the same amount, keeping the links folded. The hip pulley locks at plus twelve degrees, and the wheel extends above-left. The chassis stays fixed. The ideal animation allows overlapping parts; a real mechanism needs physical clearance and coordinated indexing actuation.</desc>
    <line data-vertical stroke="var(--border)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <path data-target fill="none" stroke="var(--viz-series-3)" stroke-width="2" stroke-dasharray="7 5"/>
    <line data-upper stroke="var(--viz-series-1)" stroke-width="13" stroke-linecap="round"/>
    <line data-lower stroke="var(--viz-series-2)" stroke-width="13" stroke-linecap="round"/>
    <path data-belt fill="none" stroke="var(--foreground)" stroke-width="2.5"/>
    <circle data-pulley-a r="28" fill="var(--background)" stroke="var(--foreground)" stroke-width="2"/>
    <circle data-pulley-b r="14" fill="var(--background)" stroke="var(--foreground)" stroke-width="2"/>
    <line data-pulley-a-mark stroke="var(--viz-series-4)" stroke-width="4"/>
    <line data-pulley-b-mark stroke="var(--foreground)" stroke-width="2"/>
    <path data-mount fill="none" stroke="var(--muted-foreground)" stroke-width="1.5"/>
    <circle data-wheel r="16" fill="var(--background)" stroke="var(--viz-series-3)" stroke-width="3"/>
    <circle data-hip r="3" fill="var(--foreground)"/>
    <text data-label-a text-anchor="start">A · Chassis</text>
    <text data-label-b>B · Knee</text>
    <text data-label-c text-anchor="end">C · Wheel</text>
    <text data-upper-path text-anchor="end">Above-left · 12°</text>
    <text data-lower-path text-anchor="end">Below-left · 12°</text>
  </svg>
  <div class="legend text-small">
    <span><i class="swatch" style="background:var(--viz-series-1)"></i>Upper link · L</span>
    <span><i class="swatch" style="background:var(--viz-series-2)"></i>Lower link · L</span>
    <span><i class="swatch" style="background:var(--viz-series-4)"></i>Hip-pulley timing mark</span>
  </div>
  <div class="text-small tabular-nums" data-detail aria-live="polite" style="margin-top:8px"></div>
  <script>
    (()=>{
      const root=document.getElementById('two-position-left-leg'),svg=root.querySelector('.motion-view'),slider=root.querySelector('#left-switch-progress');
      const el=key=>root.querySelector('[data-'+key+']');
      const set=(key,values)=>Object.entries(values).forEach(([name,value])=>el(key).setAttribute(name,value));
      let progress=0,cycle=0,previous=null,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,lastPhase='';
      function restore(state){
        if(state?.modelContent?.view!=='indexed-left-leg')return;
        if(Number.isFinite(state.modelContent.progress))progress=Math.min(1,Math.max(0,state.modelContent.progress));
        if(typeof state.privateContent?.playing==='boolean')playing=state.privateContent.playing;
        cycle=progress*8;
      }
      restore(window.openai?.widgetState);if(matchMedia('(prefers-reduced-motion: reduce)').matches)playing=false;
      function save(){window.openai?.setWidgetState?.({modelContent:{view:'indexed-left-leg',progress},privateContent:{playing}})?.catch(()=>{});}
      const ease=x=>x*x*(3-2*x);
      function pose(p){
        if(p<=.12)return {alpha:-12,theta:4,phase:'Below-left · pulley locked',indexing:false};
        if(p<.38){const t=ease((p-.12)/.26);return {alpha:-12,theta:4-106*t,phase:'Fold toward hip · pulley locked',indexing:false};}
        if(p<=.56){const t=ease((p-.38)/.18),alpha=-12+24*t;return {alpha,theta:alpha-90,phase:'Index hip pulley · keep leg folded',indexing:true};}
        if(p<.82){const t=ease((p-.56)/.26);return {alpha:12,theta:-78-98*t,phase:'Extend above-left · pulley locked',indexing:false};}
        return {alpha:12,theta:-176,phase:'Above-left · pulley locked',indexing:false};
      }
      function draw(){
        const state=pose(progress),w=Math.max(280,root.getBoundingClientRect().width),ax=w*.52,ay=260,L=Math.min(112,ax-43,w-ax-43);
        svg.setAttribute('viewBox',`0 0 ${w} 520`);
        const a=state.alpha*Math.PI/180,t=state.theta*Math.PI/180,beta=2*a-t;
        const bx=ax+L*Math.sin(t),by=ay+L*Math.cos(t),cx=bx+L*Math.sin(beta),cy=by+L*Math.cos(beta);
        const leftX=ax-2*L*Math.sin(12*Math.PI/180),dy=2*L*Math.cos(12*Math.PI/180);
        set('vertical',{x1:ax,y1:15,x2:ax,y2:505});
        set('target',{d:`M ${leftX} ${ay-dy} L ${ax} ${ay} L ${leftX} ${ay+dy}`});
        set('upper',{x1:ax,y1:ay,x2:bx,y2:by});set('lower',{x1:bx,y1:by,x2:cx,y2:cy});
        set('pulley-a',{cx:ax,cy:ay});set('pulley-b',{cx:bx,cy:by});set('hip',{cx:ax,cy:ay});set('wheel',{cx,cy});
        set('pulley-a-mark',{x1:ax-19*Math.sin(a),y1:ay-19*Math.cos(a),x2:ax-28*Math.sin(a),y2:ay-28*Math.cos(a)});
        set('pulley-b-mark',{x1:bx+7*Math.sin(beta),y1:by+7*Math.cos(beta),x2:bx+14*Math.sin(beta),y2:by+14*Math.cos(beta)});
        const dx=Math.sin(t),ddy=Math.cos(t),q=14/L,k=Math.sqrt(1-q*q);
        const np=[q*dx+k*ddy,q*ddy-k*dx],nm=[q*dx-k*ddy,q*ddy+k*dx];
        const point=(x,y,r,n)=>`${x+r*n[0]} ${y+r*n[1]}`;
        set('belt',{d:`M ${point(ax,ay,28,np)} L ${point(bx,by,14,np)} A 14 14 0 0 1 ${point(bx,by,14,nm)} L ${point(ax,ay,28,nm)} A 28 28 0 1 1 ${point(ax,ay,28,np)}`});
        set('mount',{d:`M ${ax-36} ${ay-34} H ${ax+36} M ${ax-28} ${ay-34} l -6 -9 M ${ax-10} ${ay-34} l -6 -9 M ${ax+8} ${ay-34} l -6 -9 M ${ax+26} ${ay-34} l -6 -9`});
        set('label-a',{x:ax+40,y:ay+4});
        set('label-b',{x:bx+(bx<ax?-21:21),y:by+4,'text-anchor':bx<ax?'end':'start'});
        set('label-c',{x:cx-24,y:cy+4});
        set('upper-path',{x:leftX-15,y:18});set('lower-path',{x:leftX-15,y:508});
        el('label-a').textContent=w<480?'A':'A · Chassis';el('label-b').textContent=w<480?'B':'B · Knee';el('label-c').textContent=w<480?'C':'C · Wheel';
        el('upper-path').textContent=w<480?'':'Above-left · 12°';el('lower-path').textContent=w<480?'':'Below-left · 12°';
        if(lastPhase!==state.phase){el('phase').textContent=state.phase;lastPhase=state.phase;}
        slider.value=String(progress*100);el('progress').textContent=Math.round(progress*100)+'%';el('play').textContent=playing?'Pause':'Play';
        el('detail').setAttribute('aria-live',playing?'off':'polite');
        const signed=value=>(value>=0?'+':'')+value.toFixed(1)+'°';
        el('detail').textContent=state.indexing?`Hip indexing: ${signed(state.alpha)} · C overlaps A · clearance required`:`Hip locked: ${signed(state.alpha)} · Lower-link timing: ${signed(2*state.alpha)} · 2:1 coupling`;
        root.dataset.progress=String(progress);root.dataset.alpha=String(state.alpha);root.dataset.theta=String(state.theta);root.dataset.indexing=String(state.indexing);
      }
      slider.addEventListener('input',()=>{progress=Number(slider.value)/100;cycle=progress*8;playing=false;draw();});slider.addEventListener('change',save);
      el('play').addEventListener('click',()=>{playing=!playing;previous=null;draw();save();});
      root.addEventListener('leg:progress',event=>{progress=Math.max(0,Math.min(1,event.detail.progress));cycle=progress*8;playing=false;draw();});
      window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState;if(s){restore(s);draw();}});
      new ResizeObserver(draw).observe(root);
      function tick(now){if(previous!==null&&playing){cycle=(cycle+Math.min(now-previous,100)/1000)%16;progress=cycle<=8?cycle/8:(16-cycle)/8;draw();}previous=now;requestAnimationFrame(tick);}
      draw();requestAnimationFrame(tick);
    })();
  </script>
</div>
