<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capstone · Wheel-leg force & motion</title><link rel="stylesheet" href="/viewer.css"><script src="/viewer-state.js"></script></head><body><main><div id="wheel-leg-force">
  <h2>Wheel-leg force & motion</h2>
  <div class="viz-controls">
    <label class="form-label">Wheel radius <output id="wl-radius-value"></output><input class="form-range" id="wl-radius" type="range" min="150" max="250" step="5" value="200"></label>
    <label class="form-label">Vertical travel <output id="wl-travel-value"></output><input class="form-range" id="wl-travel" type="range" min="50" max="350" step="5" value="200"></label>
    <label class="form-label">Hip output torque (N·m)<input class="form-control" id="wl-torque" type="number" min="0.1" max="200" step="0.1" value="1"></label>
    <label class="form-label">Lower angle <output id="wl-low-value"></output><input class="form-range" id="wl-low" type="range" min="10" max="40" step="1" value="30"></label>
    <label class="form-label">Widest upper angle <output id="wl-high-value"></output><input class="form-range" id="wl-high" type="range" min="65" max="85" step="1" value="75"></label>
  </div>
  <div class="viz-row">
    <button class="btn btn-primary" type="button" id="wl-play">Animate cycle</button>
    <label class="form-label" for="wl-progress">Stroke <output id="wl-progress-value"></output></label>
    <input class="form-range" id="wl-progress" type="range" min="0" max="100" step="0.1" value="50" aria-label="Stroke position">
    <label class="form-check"><input class="form-check-input" id="wl-projection" type="checkbox"><span class="form-check-label">Dashed: tangential projection from sketch</span></label>
  </div>
  <div id="wl-validation" role="alert" hidden></div>
  <div id="wl-legend" aria-label="Visible angle ranges"></div>
  <div class="wl-mechanisms" id="wl-mechanisms"></div>
  <div class="wl-charts">
    <section><h3>Vertical force vs angle</h3><div class="wl-plot" id="wl-angle"></div></section>
    <section><h3>Vertical force vs travel</h3><div class="wl-plot" id="wl-stroke"></div></section>
  </div>
  <div class="table-responsive"><table class="table table-sm"><thead><tr><th>Angle range</th><th>Each link</th><th>Link / wheel diameter</th><th>Minimum force</th><th>Travel-average force</th></tr></thead><tbody id="wl-summary"></tbody></table></div>
  <div id="wl-detail" class="text-small" aria-live="polite"></div>
  <div class="tooltip" id="wl-tooltip" role="tooltip" hidden></div>
</div>
<style>
  #wheel-leg-force { position:relative; color:var(--foreground); }
  #wheel-leg-force .wl-mechanisms { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin:16px 0; }
  #wheel-leg-force .wl-charts { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
  #wheel-leg-force .wl-plot { min-width:0; }
  #wheel-leg-force .wl-svg { display:block; width:100%; overflow:visible; }
  #wheel-leg-force .wl-svg text { fill:var(--foreground); font-size:12px; }
  #wheel-leg-force .wl-svg .domain, #wheel-leg-force .wl-svg .tick line { stroke:var(--border); }
  #wheel-leg-force #wl-progress { flex:1; min-width:110px; max-width:240px; }
  #wheel-leg-force #wl-legend { display:flex; gap:18px; flex-wrap:wrap; margin-top:16px; }
  #wheel-leg-force #wl-legend button { background:transparent; border:0; color:var(--foreground); padding:0; font:inherit; }
  #wheel-leg-force .wl-swatch { display:inline-block; width:18px; height:3px; vertical-align:middle; margin-right:6px; background:var(--series); }
  #wheel-leg-force #wl-legend button[aria-pressed="false"] { opacity:.45; text-decoration:line-through; }
  #wheel-leg-force #wl-tooltip { position:absolute; z-index:5; pointer-events:none; padding:8px 12px; background:var(--popover); color:var(--popover-foreground); max-width:260px; }
  #wheel-leg-force .wl-head { display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  #wheel-leg-force .wl-live { min-height:2.5em; }
  #wheel-leg-force #wl-detail { margin-top:12px; }
  @media(max-width:650px) { #wheel-leg-force .wl-charts { grid-template-columns:1fr; } }
  @media(max-width:480px) { #wheel-leg-force .wl-mechanisms { grid-template-columns:1fr; } }
</style>
<script src="../d3.min.js"></script>
<script src="../plotly.min.js"></script>
<script>
(() => {
  const root=document.getElementById('wheel-leg-force');
  const el=id=>root.querySelector('#wl-'+id);
  if(!window.d3||!window.Plotly){el('validation').hidden=false;el('validation').textContent='Plot libraries could not load. Rebuild the app and reopen the preview.';return;}
  const D=window.d3, rad=x=>x*Math.PI/180, deg=x=>x*180/Math.PI;
  const colors=['var(--viz-series-1)','var(--viz-series-2)','var(--viz-series-3)'];
  let state={radius:200,travel:200,torque:1,low:30,high:75,progress:.5,projection:false,visible:[true,true,true]};
  let designs=[],plots=[],running=false,startTime=0,raf=0;
  const fmt=(x,n=1)=>Number(x).toFixed(n);
  function applySaved(saved){
    const s=saved?.privateContent||saved?.modelContent;
    if(!s)return;
    for(const [k,a,b] of [['radius',150,250],['travel',50,350],['torque',.1,200],['low',10,40],['high',65,85],['progress',0,1]])if(Number.isFinite(s[k]))state[k]=Math.max(a,Math.min(b,s[k]));
    if(typeof s.projection==='boolean')state.projection=s.projection;
    if(Array.isArray(s.visible)&&s.visible.length===3)state.visible=s.visible.map(Boolean);
  }
  function save(){window.openai?.setWidgetState?.({modelContent:{...state,model:'equal links, ideal 2:1 guide, constant hip torque, no spring'},privateContent:state})?.catch(()=>{});}
  applySaved(window.openai?.widgetState);
  function syncControls(){for(const k of ['radius','travel','torque','low','high'])el(k).value=state[k];el('projection').checked=state.projection;el('progress').value=state.progress*100;}
  function calculate(){
    designs=[45,60,state.high].map((upper,i)=>{
      const L=state.travel/1000/(2*(Math.sin(rad(upper))-Math.sin(rad(state.low))));
      return {i,upper,L,color:colors[i],label:state.low+'–'+upper+'°',h0:2*L*Math.sin(rad(state.low)),minForce:state.torque/(2*L*Math.cos(rad(state.low))),average:state.torque*rad(upper-state.low)/(state.travel/1000)};
    });
  }
  function at(d,f){const h=d.h0+state.travel/1000*f,theta=Math.asin(h/(2*d.L)),J=2*d.L*Math.cos(theta);return{theta,h,J,force:state.torque/J,projection:state.torque*Math.cos(theta)/(2*d.L)};}
  function controlsReadout(){for(const k of ['radius','travel'])el(k+'-value').textContent=state[k]+' mm';for(const k of ['low','high'])el(k+'-value').textContent=state[k]+'°';}
  function buildMechanisms(){
    el('mechanisms').innerHTML=designs.map(d=>'<section data-design="'+d.i+'"><div class="wl-head"><span>'+d.label+'</span><span class="tabular-nums">L = '+fmt(d.L*1000,0)+' mm</span></div><svg class="wl-svg wl-leg" role="img" aria-label="'+d.label+' equal-link leg animation"></svg><div class="wl-live text-small tabular-nums"></div></section>').join('');
    el('summary').innerHTML=designs.map(d=>'<tr><td>'+d.label+'</td><td class="tabular-nums">'+fmt(d.L*1000,0)+' mm</td><td class="tabular-nums">'+fmt(d.L/(2*state.radius/1000),3)+'</td><td class="tabular-nums">'+fmt(d.minForce,2)+' N</td><td class="tabular-nums">'+fmt(d.average,2)+' N</td></tr>').join('');
    el('legend').innerHTML=designs.map(d=>'<button class="cursor-interaction" type="button" data-series="'+d.i+'" aria-pressed="'+state.visible[d.i]+'"><span class="wl-swatch" style="--series:'+d.color+'"></span>'+d.label+'</button>').join('');
    el('legend').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.visible[+b.dataset.series]=!state.visible[+b.dataset.series];renderPlots();updatePose();b.setAttribute('aria-pressed',state.visible[+b.dataset.series]);save();});
  }
  function drawLegs(){
    const sections=[...el('mechanisms').children],widths=sections.map(s=>s.clientWidth);
    const maxHeight=Math.max(...designs.map(d=>2*d.L*Math.sin(rad(d.upper))+state.radius/1000));
    const maxReach=Math.max(...designs.map(d=>d.L*Math.cos(rad(state.low))));
    const scale=Math.min(235/maxHeight,(Math.min(...widths)-44)/Math.max(maxReach+state.radius/1000,2*state.radius/1000+.02));
    const height=Math.max(190,maxHeight*scale+52);
    designs.forEach(d=>{
      const section=sections[d.i],W=section.clientWidth,s=D.select(section.querySelector('svg'));
      s.attr('viewBox','0 0 '+W+' '+height).attr('height',height);
      s.selectAll('*').remove();
      s.append('title').text(d.label+'; both links '+fmt(d.L*1000,0)+' mm; fixed hip, vertical wheel-centre motion.');
      const x=22+state.radius/1000*scale,y=28;
      s.append('path').attr('d','M'+(x-16)+','+(y-8)+'h32').attr('stroke','var(--foreground)').attr('stroke-width',3);
      s.append('line').attr('x1',x).attr('x2',x).attr('y1',y).attr('y2',height-12).attr('stroke','var(--border)').attr('stroke-dasharray','3 4');
      s.append('path').attr('class','wl-links').attr('fill','none').attr('stroke',d.color).attr('stroke-width',5).attr('stroke-linecap','round');
      s.append('circle').attr('class','wl-wheel').attr('r',state.radius/1000*scale).attr('fill','none').attr('stroke','var(--foreground)').attr('stroke-width',2);
      s.append('circle').attr('class','wl-knee').attr('r',5).attr('fill','var(--background)').attr('stroke',d.color).attr('stroke-width',2);
      s.append('circle').attr('cx',x).attr('cy',y).attr('r',5).attr('fill','var(--foreground)');
      s.append('path').attr('class','wl-spokes').attr('stroke','var(--border)').attr('stroke-width',1.5);
      s.append('path').attr('class','wl-force').attr('stroke',d.color).attr('stroke-width',2).attr('fill','none');
      s.append('path').attr('class','wl-angle').attr('stroke','var(--foreground)').attr('fill','none');
      s.append('text').attr('class','wl-theta').attr('x',x+28).attr('y',y+15);
      s.append('text').attr('x',x+10).attr('y',y-12).text('Hip');
      section._geometry={x,y,scale};
    });
  }

  function resolved(token){const probe=document.createElement('span');probe.style.color=token;probe.hidden=true;root.append(probe);const color=getComputedStyle(probe).color;probe.remove();return color;}
  function chartStyle(){return {paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{family:'Inter, Segoe UI, sans-serif',size:12,color:resolved('var(--foreground)')}};}
  const plotConfig={responsive:true,scrollZoom:true,displayModeBar:true,displaylogo:false,toImageButtonOptions:{format:'png',scale:2},modeBarButtonsToRemove:['lasso2d','select2d']};
  function applyTheme(theme){if(!['light','dark'].includes(theme))return;document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;renderPlotsForTheme();}
  window.addEventListener('message',e=>{if(e.data?.type==='motion-lab-theme')applyTheme(e.data.theme);});
  window.addEventListener('storage',e=>{if(e.key==='motion-lab-theme')applyTheme(e.newValue);});
  try{const theme=localStorage.getItem('motion-lab-theme');if(['light','dark'].includes(theme)){document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;}}catch{}

  function renderPlotsForTheme(){renderPlots();updatePose();}
  function renderPlots(){
    el('tooltip').hidden=true;plots=[];
    for(const kind of ['angle','stroke']){
      const container=el(kind),traces=[],markers=[];
      container.setAttribute('role','img');container.setAttribute('aria-label',kind==='angle'?'Vertical force versus link angle, interactive zoom plot':'Vertical force versus travel, interactive zoom plot');
      for(const d of designs){
        if(!state.visible[d.i])continue;
        const pts=Array.from({length:201},(_,i)=>{const f=i/200,p=at(d,f);return{x:kind==='angle'?deg(p.theta):f*state.travel,y:p.force,projection:p.projection};});
        const color=resolved(d.color);
        traces.push({x:pts.map(p=>p.x),y:pts.map(p=>p.y),type:'scatter',mode:'lines',name:d.label,line:{color,width:2.5},hovertemplate:'%{x:.2f}'+(kind==='angle'?'°':' mm')+'<br>%{y:.3f} N<extra>'+d.label+'</extra>'});
        if(state.projection)traces.push({x:pts.map(p=>p.x),y:pts.map(p=>p.projection),type:'scatter',mode:'lines',name:d.label+' projection',line:{color,width:1.5,dash:'dash'},hovertemplate:'%{y:.3f} N<extra>'+d.label+' projection</extra>'});
        const p=at(d,state.progress),x=kind==='angle'?deg(p.theta):state.progress*state.travel;
        markers.push({d,projection:false,index:traces.length});
        traces.push({x:[x],y:[p.force],type:'scatter',mode:'markers',name:d.label+' current pose',marker:{color,size:9,line:{color:resolved('var(--background)'),width:1.5}},hoverinfo:'skip'});
        if(state.projection){markers.push({d,projection:true,index:traces.length});traces.push({x:[x],y:[p.projection],type:'scatter',mode:'markers',marker:{color:resolved('var(--background)'),size:8,line:{color,width:1.5}},hoverinfo:'skip'});}
      }
      const axis={gridcolor:resolved('var(--border)'),zerolinecolor:resolved('var(--border)'),automargin:true};
      Plotly.react(container,traces,{...chartStyle(),height:310,margin:{l:68,r:18,t:24,b:64},showlegend:false,hovermode:'x unified',dragmode:'zoom',uirevision:kind+'-'+[state.radius,state.travel,state.torque,state.low,state.high].join(':'),xaxis:{...axis,title:{text:kind==='angle'?'θ from horizontal (°)':'Travel from compressed pose (mm)'},nticks:container.clientWidth<400?4:6},yaxis:{...axis,title:{text:'Vertical force (N)'},rangemode:'tozero'}},plotConfig);
      plots.push({kind,container,markers});
    }
  }
  function updatePose(){
    const maxForce=Math.max(...designs.map(d=>at(d,1).force));
    designs.forEach(d=>{
      const sec=el('mechanisms').children[d.i],g=sec._geometry;if(!g)return;
      const p=at(d,state.progress),{x,y,scale}=g,kx=x+d.L*Math.cos(p.theta)*scale,ky=y+d.L*Math.sin(p.theta)*scale,wy=y+p.h*scale,r=state.radius/1000*scale;
      const svg=D.select(sec.querySelector('svg'));
      svg.select('.wl-links').attr('d','M'+x+','+y+'L'+kx+','+ky+'L'+x+','+wy);
      svg.select('.wl-knee').attr('cx',kx).attr('cy',ky);svg.select('.wl-wheel').attr('cx',x).attr('cy',wy);
      svg.select('.wl-spokes').attr('d','M'+(x-r)+','+wy+'h'+(2*r)+'M'+x+','+(wy-r)+'v'+(2*r));
      const arrowX=x+r+12,arrowLength=12+45*p.force/maxForce,arrowY=wy;
      svg.select('.wl-force').attr('d','M'+arrowX+','+arrowY+'v-'+arrowLength+'m-4,6l4,-6l4,6');
      const rr=24;svg.select('.wl-angle').attr('d','M'+(x+rr)+','+y+'A'+rr+','+rr+' 0 0 1 '+(x+rr*Math.cos(p.theta))+','+(y+rr*Math.sin(p.theta)));
      svg.select('.wl-theta').text(fmt(deg(p.theta),1)+'°');
      sec.querySelector('.wl-live').textContent=fmt(p.force,2)+' N · '+fmt(p.J*1000*Math.PI/180,1)+' mm/degree';
      sec.style.opacity=state.visible[d.i]?'1':'.45';
    });
    for(const plot of plots){
      const values=plot.markers.map(marker=>{const p=at(marker.d,state.progress);return{x:plot.kind==='angle'?deg(p.theta):state.progress*state.travel,y:marker.projection?p.projection:p.force};});
      if(values.length)Plotly.restyle(plot.container,{x:values.map(p=>[p.x]),y:values.map(p=>[p.y])},plot.markers.map(m=>m.index));
    }
    el('progress').value=state.progress*100;el('progress-value').textContent=fmt(state.progress*100,0)+'%';
  }
  function pause(){running=false;cancelAnimationFrame(raf);el('play').textContent='Animate cycle';}
  function render(){calculate();controlsReadout();buildMechanisms();drawLegs();renderPlots();updatePose();el('detail').textContent='Equal links · ideal 2:1 guide · constant hip torque · spring and dynamics excluded · common physical scale · geometric playback';}
  for(const key of ['radius','travel','torque','low','high'])el(key).addEventListener('input',()=>{
    const value=Number(el(key).value);if(!Number.isFinite(value)||value<+el(key).min||value>+el(key).max){el('validation').hidden=false;el('validation').textContent='Enter hip torque between 0.1 and 200 N·m.';return;}
    el('validation').hidden=true;pause();state[key]=value;render();save();
  });
  el('projection').onchange=()=>{state.projection=el('projection').checked;renderPlots();updatePose();save();};
  el('progress').oninput=()=>{pause();state.progress=Number(el('progress').value)/100;updatePose();};el('progress').onchange=save;
  el('play').onclick=()=>{if(running){pause();save();return;}running=true;startTime=performance.now();el('play').textContent='Pause';
    function frame(now){const phase=(now-startTime)/3000;state.progress=phase<=1?phase:Math.max(0,2-phase);updatePose();if(phase>=2){pause();save();return;}raf=requestAnimationFrame(frame);}raf=requestAnimationFrame(frame);
  };
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){pause();applySaved(e.detail.globals.widgetState);syncControls();render();}});
  let resizePending=0;new ResizeObserver(()=>{cancelAnimationFrame(resizePending);resizePending=requestAnimationFrame(()=>{drawLegs();plots.forEach(p=>Plotly.Plots.resize(p.container));updatePose();});}).observe(root);
  syncControls();render();
})();
</script>
</main></body></html>
